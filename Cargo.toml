[package]
name = "guixvis"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Interactive package explorer and dependency visualizer for GNU Guix"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
flate2 = "1.1.10"
http-body-util = { version = "0.1", optional = true }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
unicode-width = "0.2.2"

[features]
web = ["dep:axum", "dep:tokio", "dep:tower", "dep:http-body-util"]

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
tower = { version = "0.5", features = ["util"] }
